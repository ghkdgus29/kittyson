name: CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.secrets.outputs.ok }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Run tests
      run: uv run pytest -q

    # 배포 시크릿이 아직 없으면 빌드·배포를 실패시키지 않고 건너뛴다
    - name: Check deploy secrets
      id: secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        SERVER_TS_IP: ${{ secrets.SERVER_TS_IP }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        missing=""
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET SERVER_TS_IP SSH_PRIVATE_KEY; do
          if [ -z "${!name}" ]; then missing="$missing $name"; fi
        done
        if [ -z "$missing" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::배포 시크릿이 없어 빌드·배포를 건너뜁니다:$missing"
        fi

  build-and-push:
    needs: test
    if: needs.test.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittyson:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Copy deploy compose file to homelab
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_TS_IP }}
        username: deploy
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "~/kittyson/"

    - name: Deploy to homelab via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_TS_IP }}
        username: deploy
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          cd ~/kittyson
          mkdir -p data

          # 서버에서 직접 docker compose up/restart 해도 되도록 .env를 남겨둔다 (본인만 읽기)
          # ENV_FILE_CONTENT는 선택이다. 비어 있으면 기본 설정으로 뜬다.
          umask 077
          cat > .env <<'ENVEOF'
          ${{ secrets.ENV_FILE_CONTENT }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
