# The Xcode project is generated from this file: `xcodegen generate`
name: Kittyson
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Kittyson:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghkdgus29.kittyson
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: kittyson
        KittysonServer: $(KITTYSON_SCHEME)://$(KITTYSON_HOST)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # HTTP only for a server at home
        NSLocalNetworkUsageDescription: 집 안의 kittyson 서버에서 고양이와 JSON을 받아옵니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Config/Kittyson.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ghkdgus29.kittyson]
    dependencies:
      - target: KittysonWidget
      - target: KittysonWatch

  KittysonWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghkdgus29.kittyson.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: kittyson
        KittysonServer: $(KITTYSON_SCHEME)://$(KITTYSON_HOST)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # HTTP only for a server at home
        NSExtension: {NSExtensionPointIdentifier: com.apple.widgetkit-extension}
    entitlements:
      path: Config/Kittyson.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ghkdgus29.kittyson]

  KittysonWatch:
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghkdgus29.kittyson.watchkitapp
    info:
      path: Config/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: kittyson
        KittysonServer: $(KITTYSON_SCHEME)://$(KITTYSON_HOST)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # HTTP only for a server at home
        WKApplication: true
        WKBackgroundModes: [alarm]   # the timer's alarm, see WatchApp/Alarm.swift
        WKCompanionAppBundleIdentifier: com.ghkdgus29.kittyson
    entitlements:
      path: Config/Kittyson.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ghkdgus29.kittyson]
    dependencies:
      - target: KittysonWatchWidget

  KittysonWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghkdgus29.kittyson.watchkitapp.widget
    info:
      path: Config/WatchWidget-Info.plist
      properties:
        CFBundleDisplayName: kittyson
        KittysonServer: $(KITTYSON_SCHEME)://$(KITTYSON_HOST)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # HTTP only for a server at home
        NSExtension: {NSExtensionPointIdentifier: com.apple.widgetkit-extension}
    entitlements:
      path: Config/Kittyson.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ghkdgus29.kittyson]
