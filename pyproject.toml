[project]
name = "kittyson"
version = "0.1.0"
description = "kitty + JSON. A daily cat background with a live JSON clock widget."
readme = "README.md"
authors = [
    { name = "hyun", email = "ghkdgus29@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kittyson = "kittyson.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
